name: Update VK Stream M3U8

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest yt-dlp
        run: pip install -U yt-dlp

      - name: Fetch fresh stream playlists and build playlist.m3u
        run: |
          set -e
          max_attempts=3
          attempt=1

          while true; do
            echo "Attempt $attempt of $max_attempts..."
            if python update_stream.py; then
              echo "Succeeded on attempt $attempt"
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "All $max_attempts attempts failed."
              exit 1
            fi

            attempt=$((attempt + 1))
            echo "Failed. Waiting 15 seconds before retry..."
            sleep 15
          done

      - name: Commit and push if playlists changed
        env:
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f "*.m3u8" playlist.m3u

          if ! git diff --quiet || ! git diff --staged --quiet; then
            echo "Changes detected in playlists:"
            git status --short
            git commit -m "Update stream playlists"
            git pull --rebase --autostash origin "$GIT_BRANCH"
            git push
            echo "Committed and pushed updated playlists successfully."
          else
            echo "No changes detected in *.m3u8 or playlist.m3u. Skipping commit and push."
          fi
