name: Update VK Stream M3U8

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest yt-dlp
        run: pip install -U yt-dlp

      - name: Fetch fresh stream URL and write stream.m3u8
        run: python update_stream.py

      - name: Commit and push if stream.m3u8 changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stream.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stream.m3u8" && git push)
